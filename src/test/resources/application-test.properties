server.servlet.context-path=

spring.datasource.url=jdbc:h2:mem:ecommerce_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-with-sufficient-length-123456789
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000
app.password-reset.expiration-minutes=30
app.bootstrap.admin.enabled=false
app.bootstrap.admin.first-name=Admin
app.bootstrap.admin.last-name=User
app.bootstrap.admin.email=admin@test.com
app.bootstrap.admin.password=Admin@12345
